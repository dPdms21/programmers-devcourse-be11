<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/signIn.js}"></script>
    <link th:href="@{/css/signUp.css}" rel="stylesheet">
    <title>로그인</title>
</head>
<body>

<div class="signup-container">
    <h2>로그인</h2>
    <div>
        <div class="form-group">
            <label for="user_id">아이디</label>
            <input type="text" id="user_id" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <input id="signin" type="submit" value="로그인">

        <!-- [카카오 로그인 버튼]
             버튼이라기보다 "단순 링크"라는 점이 핵심. ajax도 JS도 필요 없음
             /oauth2/authorization/kakao는 우리가 만든 컨트롤러가 아니라
             OAuth2AuthorizationRequestRedirectFilter가 가로채는 규약 경로(SecurityConfig 참고) —
             브라우저가 이 링크를 따라가는 순간 카카오 인가 페이지로 리다이렉트되며 표준 흐름이 시작됨
             자체 로그인(위의 ajax)과 달리 이후 과정 전체가 "페이지 이동"으로 진행됨
             [MSA] 그 필터는 auth-service에 있으므로 상대경로(8080=web, 404)가 아니라
             edge(8000) 주소로 가야 함. edge가 /oauth2/** 를 auth-service로 라우팅 -->
        <a href="http://localhost:8000/oauth2/authorization/kakao" class="kakao-login-btn"
           style="display:block; margin-top:10px; padding:12px 0; text-align:center;
              background:#FEE500; color:rgba(0,0,0,.85); border-radius:6px;
              text-decoration:none; font-weight:bold;">
            카카오 로그인
        </a>

        <div class="page-link">
            계정이 없으신가요? <a href="/users/join">회원가입</a>
        </div>

        <!-- OAuth2 실패/미가입 시 핸들러가 /users/login?error=메시지 로 돌려보냄
        (리다이렉트 방식이라 JSON 응답을 받을 JS가 없기 때문 — OAuth2FailureHandler 주석 참고)
        그 메시지를 여기서 보여줌 -->
        <div id="oauth-error" style="display:none; margin-top:10px; color:#d93025; font-size:14px;"></div>
        <script>
            const oauthError = new URLSearchParams(window.location.search).get('error');
            if (oauthError) {
                document.getElementById('oauth-error').textContent = oauthError;
                document.getElementById('oauth-error').style.display = 'block';
                // 새로고침할 때마다 에러가 다시 뜨지 않도록 주소창에서 ?error=를 지움 (히스토리 정리)
                history.replaceState(null, '', window.location.pathname);
            }
        </script>
    </div>
</div>
</body>
</html>
