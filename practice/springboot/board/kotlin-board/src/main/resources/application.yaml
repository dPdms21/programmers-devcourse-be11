server:
  port: 8081

spring:
  application:
    name: kotlin-board

  datasource:
    url: jdbc:mysql://localhost:3306/kotlin_board?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info