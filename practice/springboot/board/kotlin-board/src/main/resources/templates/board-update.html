<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글수정</title>
    <link th:href="@{/css/board.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/boardUpdate.js}"></script>
</head>
<body>
<div class="container">
    <h1>글수정</h1>
    <p class="subtitle">PUT /api/boards/{id}</p>

    <input id="boardId" type="hidden" th:value="${id}">

    <div class="form-group">
        <label for="userId">작성자</label>
        <!-- 작성자는 수정 대상이 아님. 엔티티에서도 val로 막아 두었음 -->
        <input id="userId" type="text" disabled>
    </div>

    <div class="form-group">
        <label for="title">제목</label>
        <input id="title" type="text" maxlength="200">
    </div>

    <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" rows="12"></textarea>
    </div>

    <div class="form-actions">
        <button id="submitBtn" class="btn primary" type="button">수정</button>
        <a th:href="@{/}" class="btn">목록으로</a>
    </div>
</div>
</body>
</html>
