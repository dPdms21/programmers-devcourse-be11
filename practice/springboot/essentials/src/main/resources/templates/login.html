<!DOCTYPE html>
<!--
  타임리프(Thymeleaf)
  - <html> 태그에 xmlns:th 네임스페이스를 선언하면 IDE에서 th:* 속성을 인식하기 쉬움
  - 타임리프는 th:* 속성을 사용해 서버 데이터를 HTML에 반영
  - 서버에서 렌더링되지 않은 경우에도 기본 HTML 구조를 확인할 수 있음
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <!-- 세션에 username이 있으면 환영 메시지 표시 -->
    <div th:if="${username}">
        <p th:text="${username} + '님 환영합니다!'"></p>
        <a href="/logout">로그아웃</a>
    </div>

    <!-- 세션에 username이 없으면 로그인 폼 표시 -->
    <div th:unless="${username}">
        <form action="/login" method="post">
            <label for="username">사용자 이름:</label>
            <input type="text" id="username" name="username" required />
            <button type="submit">로그인</button>
        </form>
    </div>
</body>
</html>
