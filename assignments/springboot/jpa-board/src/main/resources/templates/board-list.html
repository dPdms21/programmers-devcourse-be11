<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-3.7.1.js"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/boardList.js}"></script>

    <link th:href="@{/css/board.css}" rel="stylesheet">
    <title>게시판</title>
</head>
<body>

<div class="container">
    <h1 id="welcomeMessage">게시판</h1>

    <div class="board-header">
        <div class="member-status">
            <span id="roleBadge"></span>
        </div>

        <div id="guestMenu" class="board-actions">
            <a id="loginBtn"
               th:href="@{/members/login}"
               class="btn">
                로그인
            </a>

            <a th:href="@{/members/join}"
               class="btn">
                회원가입
            </a>
        </div>

        <div id="memberMenu"
             class="board-actions"
             style="display: none;">
            <a id="writeBtn"
               th:href="@{/write}"
               class="btn">
                글쓰기
            </a>

            <button id="logoutBtn"
                    type="button"
                    class="btn logout-btn">
                로그아웃
            </button>
        </div>
    </div>

    <div id="board">
        <table>
            <thead>
            <tr>
                <th>글 번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
            </thead>

            <tbody id="boardContent"></tbody>
        </table>
    </div>

    <div id="pagination"></div>
</div>

</body>
</html>
